name: insurance_analytics
version: "1.0.0"
profile: insurance_analytics

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "logs"]

# Medallion mapping: raw (bronze, loaded by Kafka consumer) -> staging + intermediate (silver) -> marts (gold)
models:
  insurance_analytics:
    staging:
      +schema: staging
      +materialized: incremental
      +incremental_strategy: delete+insert
      +tags: ["silver"]
    intermediate:
      +schema: intermediate
      +materialized: table
      +tags: ["silver"]
    marts:
      +schema: marts
      +materialized: table
      +tags: ["gold"]
